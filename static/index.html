<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manas Ranjan Sahoo - AI Career Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #chat-widget {
            width: 400px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #chat-messages {
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #eee;
        }
        .message {
            padding: 10px 14px;
            border-radius: 6px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
        }
        .bot-message {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
        }
        .input-container {
            display: flex;
            padding: 10px;
            background: #fff;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            margin-left: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div id="chat-widget">
  <div id="chat-messages">
      <div class="message bot-message">Hi! I am Manas's virtual career assistant. Ask me anything about his professional background or skills!</div>
  </div>
  <div class="input-container">
      <input type="text" id="user-input" placeholder="Ask about my career..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
async function sendMessage() {
    const inputField = document.getElementById("user-input");
    const chatMessages = document.getElementById("chat-messages");
    const messageText = inputField.value.trim();

    if (!messageText) return;

    // 1. Append User Message to UI
    appendMessage(messageText, "user-message");
    inputField.value = "";

    // Scroll down to latest message
    chatMessages.scrollTop = chatMessages.scrollHeight;

    try {
        // 2. Fetch response from FastAPI backend
        const response = await fetch("http://localhost:8000/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: messageText })
        });

        const data = await response.json();

        if (response.ok) {
            // 3. Append Bot Reply to UI
            appendMessage(data.reply, "bot-message");
        } else {
            appendMessage(data.detail || "Something went wrong. Please try again.", "bot-message");
        }
    } catch (error) {
        appendMessage("Network error: Could not reach the server.", "bot-message");
    }

    // Scroll down again
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function appendMessage(text, className) {
    const chatMessages = document.getElementById("chat-messages");
    const messageDiv = document.createElement("div");
    messageDiv.className = `message ${className}`;
    messageDiv.innerText = text;
    chatMessages.appendChild(messageDiv);
}

function handleKeyPress(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}
</script>

</body>
</html>
